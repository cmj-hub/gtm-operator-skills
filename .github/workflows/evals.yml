name: evals

# Manual only: each case calls the model and is billed to the key's account.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Skip without a key
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "No ANTHROPIC_API_KEY secret; skipping evals."
      - name: Install Claude Code
        if: env.ANTHROPIC_API_KEY != ''
        run: npm install -g @anthropic-ai/claude-code@2.1.289
      # Bash runs inside the eval sandbox, which needs bubblewrap and socat; dig
      # lets the deliverability checks resolve DNS.
      - name: Install sandbox tools
        if: env.ANTHROPIC_API_KEY != ''
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap socat dnsutils
      # A plugin with dependencies is dropped when loaded from a folder (no
      # marketplace to resolve them), so evaluate a copy without the list.
      # The two skills do not need the packs to fire.
      - name: Run suite evals
        if: env.ANTHROPIC_API_KEY != ''
        run: |
          cp -r suite "$RUNNER_TEMP/suite"
          python3 -c "import json,sys; p=sys.argv[1]; m=json.load(open(p)); m.pop('dependencies', None); json.dump(m, open(p, 'w'), indent=2)" "$RUNNER_TEMP/suite/.claude-plugin/plugin.json"
          cd "$RUNNER_TEMP/suite"
          claude plugin eval . --trust-plugin --runs 1 --no-publish --threshold 0.8 --allow-tools Bash --judge-model sonnet
