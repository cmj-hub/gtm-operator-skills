name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Suite
        run: python -m unittest discover -s tests -v
      - name: Build-pack gate tests
        run: python -m unittest discover -s build/tests -v
      - name: Build-pack gates itself
        run: python build/scripts/check_pack.py pack build --public
      - name: Suite checker compiles
        run: python -m py_compile scripts/check_suite.py
