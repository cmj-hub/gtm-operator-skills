name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Suite
        run: python -m unittest discover -s tests -v
      - name: Build-pack gate tests
        run: python -m unittest discover -s build/tests -v
      - name: Build-pack gates itself
        run: python build/scripts/check_pack.py pack build --public
      - name: Suite checker compiles
        run: python -m py_compile scripts/check_suite.py
